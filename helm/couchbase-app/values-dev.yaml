# Development environment values
replicaCount: 2

image:
  repository: xlen911/couchbase-app
  tag: 1.0.24
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: couchbase-app-dev.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - couchbase-app-dev.example.com
      secretName: couchbase-app-tls

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

couchbase:
  connectionString: "couchbase://couchbase-cluster.couchbase-dev.svc.cluster.local"
  username: "Administrator"
  password: "TempP@ssw0rd2026!"
  bucket: "customers"
  scope: "sales"

# ✅ Agregar sección de environment
env:
  nodeEnv: "development"
  logLevel: "debug"
  port: "3000"
  maxConnections: "50"
  queryTimeout: "60000"
  maxQueryLimit: "500"
  corsOrigin: "*"

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"