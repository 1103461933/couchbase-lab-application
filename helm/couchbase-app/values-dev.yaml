# Development environment values
replicaCount: 2

image:
  repository: xlen911/couchbase-app
  tag: latest  # Updated by CI pipeline
  pullPolicy: Always

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

config:
  NODE_ENV: "development"
  LOG_LEVEL: "debug"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: couchbase-app-dev.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - couchbase-app-dev.example.com
      secretName: couchbase-app-tls-dev

secrets:
  couchbase:
    connectionString: "couchbase://couchbase-cluster.couchbase-dev.svc.cluster.local"
    username: "Administrator"
    password: "TempP@ssw0rd2026!"
    bucket: "customers"
    scope: "sales"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70