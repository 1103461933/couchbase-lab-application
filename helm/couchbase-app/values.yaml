replicaCount: 2

image:
  repository: xlen911/couchbase-app
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# ✅ Agregar sección de Ingress
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: couchbase-app.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ✅ Agregar sección couchbase
couchbase:
  connectionString: "couchbase://couchbase-cluster.couchbase-dev.svc.cluster.local"
  username: "Administrator"
  password: "TempP@ssw0rd2026!"
  bucket: "customers"
  scope: "sales"

# ✅ Agregar otras configuraciones
config:
  NODE_ENV: "production"
  LOG_LEVEL: "info"