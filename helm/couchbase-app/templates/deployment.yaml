apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "couchbase-app.fullname" . }}
  labels:
    {{- include "couchbase-app.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "couchbase-app.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "couchbase-app.selectorLabels" . | nindent 8 }}

    spec:
      serviceAccountName: {{ include "couchbase-app.fullname" . }}

      containers:
        - name: couchbase-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}

          envFrom:
            - configMapRef:
                name: {{ include "couchbase-app.fullname" . }}

            - secretRef:
                name: {{ include "couchbase-app.fullname" . }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20