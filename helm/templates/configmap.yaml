apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "couchbase-app.fullname" . }}

data:
  NODE_ENV: {{ .Values.env.nodeEnv | quote }}
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  COUCHBASE_CONNECTION_STRING: {{ .Values.couchbase.connectionString | quote }}
  COUCHBASE_BUCKET: {{ .Values.couchbase.bucket | quote }}
  COUCHBASE_SCOPE: {{ .Values.couchbase.scope | quote }}