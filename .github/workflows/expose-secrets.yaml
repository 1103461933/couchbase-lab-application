name: Export Secrets as Artifacts

on:
  workflow_dispatch:  # Manual trigger

jobs:
  export-secrets:
    runs-on: ubuntu-latest
    environment: dev  # Especifica el ambiente dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create secrets file
        run: |
          mkdir -p secrets_export
          echo "DOCKER_USERNAME=${DOCKER_USERNAME}" > secrets_export/secrets.txt
          echo "DOCKER_PASSWORD=${DOCKER_PASSWORD}" >> secrets_export/secrets.txt
          echo "PAT_TOKEN=${PAT_TOKEN}" >> secrets_export/secrets.txt
          echo "--- Secrets exported ---"
          cat secrets_export/secrets.txt
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      
      - name: Upload secrets as artifact
        uses: actions/upload-artifact@v4
        with:
          name: secrets-export
          path: secrets_export/
          