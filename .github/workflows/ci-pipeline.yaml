name: CI Pipeline - Build, Test, Push to Docker Hub

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: xlen911/couchbase-app  # <<--- CAMBIADO: tu usuario de Docker Hub
  NAMESPACE: couchbase-dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run security audit
        run: npm audit --production || true  # No falla el pipeline por auditoría

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            VERSION=latest
          else
            VERSION=${GITHUB_SHA::8}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Helm values with new image tag
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          # Actualizar values-dev.yaml
          sed -i "s|tag: .*|tag: ${{ env.VERSION }}|g" helm/couchbase-app/values-dev.yaml
          
          # Si es un tag, actualizar también values-prod.yaml
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            if [ -f helm/couchbase-app/values-prod.yaml ]; then
              sed -i "s|tag: .*|tag: ${{ env.VERSION }}|g" helm/couchbase-app/values-prod.yaml
            fi
          fi

      - name: Commit and push changes
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/couchbase-app/values-dev.yaml
          if [[ $GITHUB_REF == refs/tags/v* ]] && [ -f helm/couchbase-app/values-prod.yaml ]; then
            git add helm/couchbase-app/values-prod.yaml
          fi
          git commit -m "chore: update image tag to ${{ env.VERSION }} [skip ci]" || echo "No changes to commit"
          git push